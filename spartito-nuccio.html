<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spartito – Versione di Nuccio – Viva la LUTE</title>
<meta name="robots" content="noindex">
<style>
  :root { --verde: #1b5e3f; --scuro: #0e3423; --notte: #09261a; --oro: #d6b050; --crema: #f8f4ea; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(ellipse at 50% 0%, var(--verde), var(--scuro) 60%, var(--notte));
         background-attachment: fixed; color: var(--crema); font-family: "Segoe UI", system-ui, Arial, sans-serif; }
  .barra { position: sticky; top: 0; z-index: 5; background: rgba(9,38,26,.96); border-bottom: 1px solid rgba(214,176,80,.5);
           display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
  .barra a { text-decoration: none; font-weight: 700; border: 2px solid var(--oro); border-radius: 12px; padding: 9px 14px; font-size: 17px; }
  .indietro { color: var(--crema); }
  .scarica { background: var(--oro); color: var(--notte); margin-left: auto; }
  header { text-align: center; padding: 22px 16px 6px; }
  h1 { font-family: Georgia, serif; font-size: clamp(26px, 6vw, 40px); }
  .sub { font-family: Georgia, serif; font-style: italic; color: var(--oro); font-size: clamp(18px, 4.5vw, 24px); }
  .nota { max-width: 760px; margin: 12px auto 0; font-size: 16px; opacity: .85; text-align: center; padding: 0 8px; text-wrap: pretty; }
  main { max-width: 900px; margin: 18px auto 40px; padding: 0 10px; display: grid; gap: 16px; }
  main img { width: 100%; height: auto; display: block; background: white; border-radius: 6px;
             box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  @media (max-width: 480px) { .barra a { font-size: 16px; padding: 8px 11px; } }
</style>
</head>
<body>
  <nav class="barra">
    <a class="indietro" href="./">&larr; Indietro</a>
    <a class="scarica" href="spartito-nuccio-v1.pdf" download="Spartito Viva la LUTE - Versione di Nuccio.pdf">&#11015; Scarica PDF per stampare</a>
  </nav>
  <header>
    <h1>Viva la LUTE – spartito</h1>
    <div class="sub">Versione di Nuccio · Inno corale solenne</div>
    <p class="nota">Melodia con le parole sotto le note, trascritta dalla registrazione: chi suona la verifichi a orecchio.
      Sul telefono si ingrandisce allargando con due dita.</p>
  </header>
  <main>
    <img src="spartito-nuccio-p1-v1.png" alt="Spartito, pagina 1 di 5" loading="eager">
    <img src="spartito-nuccio-p2-v1.png" alt="Spartito, pagina 2 di 5" loading="lazy">
    <img src="spartito-nuccio-p3-v1.png" alt="Spartito, pagina 3 di 5" loading="lazy">
    <img src="spartito-nuccio-p4-v1.png" alt="Spartito, pagina 4 di 5" loading="lazy">
    <img src="spartito-nuccio-p5-v1.png" alt="Spartito, pagina 5 di 5" loading="lazy">
  </main>
</body>
</html>
